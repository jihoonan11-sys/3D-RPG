<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>성채 RPG - PHASE 3</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2430; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; top: 12px; color: #fff;
    background: rgba(0, 0, 0, 0.5); padding: 10px 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.7; pointer-events: none; user-select: none;
  }
  #hud b { color: #ffd76a; }
  #toast {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%);
    color: #fff; background: rgba(20, 16, 10, 0.72); border: 1px solid rgba(255, 215, 106, 0.6);
    padding: 10px 26px; border-radius: 8px; font-size: 20px; letter-spacing: 0.5px;
    opacity: 0; transition: opacity 0.6s; pointer-events: none; user-select: none;
  }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; text-align: center; padding: 24px; line-height: 1.7; background: #1b2430;
  }
  #status.error { color: #ff9c9c; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="status">게임을 불러오는 중입니다...</div>
<div id="hud" style="display:none"></div>
<div id="toast"></div>

<script>
  // 오류가 생기면 화면에 표시해서 캡처해 보낼 수 있게 한다.
  function showError(msg) {
    var el = document.getElementById('status');
    if (!el) { el = document.createElement('div'); el.id = 'status'; document.body.appendChild(el); }
    el.className = 'error';
    el.style.display = 'flex';
    el.textContent = msg;
  }
  window.addEventListener('error', function (e) { showError('오류가 발생했습니다:\n' + e.message); });
  setTimeout(function () {
    var el = document.getElementById('status');
    if (el && !el.className) {
      showError('불러오는 데 시간이 오래 걸립니다. 인터넷 연결을 확인하고 Ctrl+Shift+R 로 새로고침해 주세요.\n(파일을 컴퓨터에서 직접 열면 동작하지 않습니다. GitHub Pages 링크로 여세요.)');
    }
  }, 8000);
</script>

<script type="module" src="client/main.js"></script>

</body>
</html>
